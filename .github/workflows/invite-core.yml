name: Android and Tox CI
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: fgchat-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure preinstalled Android SDK tools
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < <(yes) > /dev/null
      - run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - run: python3 scripts/fetch-native.py linux-x86_64
      - run: python3 scripts/build-android-native.py
      - run: cmake -S native -B native/build && cmake --build native/build
      - run: ./gradlew :invite-core:test :tox-engine:test :android-app:lintDebug :android-app:assembleDebug :android-app:exportRuntimeDependencies --no-daemon
      - run: python3 scripts/scan-dependencies.py
      - run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 android-app/build/outputs/apk/debug/android-app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify android-app/build/outputs/apk/debug/android-app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FG-Chat-debug-and-test-evidence
          path: |
            android-app/build/outputs/apk/debug/*.apk
            android-app/build/reports/
            tox-engine/build/test-results/
            tox-engine/build/reports/tests/
            invite-core/build/test-results/
            build/reports/dependency-scan.json
            .native-deps/c-toxcore-v0.2.23.tar.gz
            .native-deps/libsodium-1.0.22.tar.gz
          if-no-files-found: error
          include-hidden-files: true
  android-35:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure preinstalled Android SDK tools
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < <(yes) > /dev/null
      - run: sdkmanager 'ndk;27.2.12479018' 'cmake;3.22.1'
      - run: python3 scripts/build-android-native.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            status=0
            ./gradlew :android-app:connectedDebugAndroidTest --no-daemon || status=$?
            mkdir -p evidence/android-35
            adb pull /sdcard/Android/data/com.fgchat.app/files/evidence evidence/android-35 || true
            exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-35-instrumentation
          path: |
            android-app/build/reports/androidTests/
            android-app/build/outputs/androidTest-results/
            evidence/android-35/
