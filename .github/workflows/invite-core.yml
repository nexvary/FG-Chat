name: Invite Core CI
on:
  push:
    paths:
      - 'invite-core/**'
      - 'settings.gradle.kts'
      - '.github/workflows/invite-core.yml'
  pull_request:
    paths:
      - 'invite-core/**'
      - 'settings.gradle.kts'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle :invite-core:test --no-daemon
